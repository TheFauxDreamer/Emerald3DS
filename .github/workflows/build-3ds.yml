# Builds the 3DS port end-to-end in devkitPro's official container, so the
# .3dsx is reproducible without a local toolchain.
#
# Mirrors the manual sequence in 3ds/README.md exactly:
#   make tools && make generated
#   tools/generate_wasm_assets.py    -> build/assets
#   rp2350/gen_sound_assets.sh       -> sample .bin + song .s
#   3ds/build_objs.sh                -> 3ds/build/libpokeemerald.a
#   make -C 3ds                      -> 3ds/emerald3ds.3dsx
name: Build 3DS

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an in-flight build irrelevant.
concurrency:
  group: build-3ds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: devkitpro/devkitarm:latest

    # Two mixers, built side by side.
    #
    # CTR_M4A_ASM=0 is the C reimplementation of src/m4a_1.s; =1 assembles the
    # original instead, which the ARM11 can run and the RP2350's Cortex-M33
    # cannot. Which one sounds right is the open question, and it cannot be
    # answered without both in hand -- the builds happen here, not on a desk, so
    # the choice has to be made here too.
    #
    # fail-fast is off deliberately. The assembly variant is unproven and may
    # not even assemble; if it breaks it must not cancel the build that works.
    strategy:
      fail-fast: false
      matrix:
        include:
          - m4a: 0
            variant: c-engine
          - m4a: 1
            variant: m4a-asm

    name: build (${{ matrix.variant }})

    env:
      # Read by 3ds/build_objs.sh, which records it in 3ds/build/m4a_asm.flag so
      # 3ds/Makefile stamps the same value into the boot log. Setting it once
      # here is what keeps the binary and the log agreeing.
      CTR_M4A_ASM: ${{ matrix.m4a }}

    steps:
      - uses: actions/checkout@v4

      # The decomp tools are host binaries: gbagfx/rsfont need libpng, the rest
      # need a plain g++. The devkitARM image ships the cross toolchain only.
      - name: Install host build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkg-config libpng-dev zlib1g-dev python3 \
            curl unzip ca-certificates
          # checkout leaves the tree owned by a different uid than the container
          # user; without this git calls inside the build refuse to run.
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true

      # 3ds/build_objs.sh looks up arm-none-eabi-gcc on PATH and hard-errors if
      # it is absent; 3ds/Makefile calls smdhtool/3dsxtool out of tools/bin.
      # Set both explicitly rather than trusting the image's PATH.
      - name: Put devkitARM on PATH
        run: |
          echo "/opt/devkitpro/devkitARM/bin" >> "$GITHUB_PATH"
          echo "/opt/devkitpro/tools/bin" >> "$GITHUB_PATH"

      # The link needs citro2d/citro3d alongside libctru. Present in the image
      # today, installed here if a future tag drops them.
      - name: Ensure 3DS libraries are present
        run: |
          if [ ! -f /opt/devkitpro/libctru/lib/libcitro2d.a ]; then
            dkp-pacman -Sy --noconfirm --needed 3ds-dev
          fi
          arm-none-eabi-gcc --version | head -1

      - name: Build decomp tools
        run: make tools -j"$(nproc)"

      - name: Generate map/JSON sources
        run: make generated

      # Root Makefile's wasm-assets target wraps this in `uv run`; the script is
      # pure stdlib, so call it directly instead of installing uv.
      - name: Generate graphics assets
        run: python3 tools/generate_wasm_assets.py

      - name: Generate sound assets
        run: bash rp2350/gen_sound_assets.sh

      - name: Build game archive (ARM11)
        run: bash 3ds/build_objs.sh

      - name: Link emerald3ds.elf
        run: make -C 3ds emerald3ds.elf

      # Also published on its own: Azahar/Citra can boot a raw ELF, and it is
      # what you want for symbol-level debugging.
      # The .map goes with it: a crash log only ever gives a raw PC, and these
      # two are the only way to turn one back into a function name.
      - name: Upload ELF + link map
        uses: actions/upload-artifact@v4
        with:
          name: emerald3ds-elf-${{ matrix.variant }}
          path: |
            3ds/emerald3ds.elf
            3ds/build/emerald3ds.map
          if-no-files-found: error

      # makerom is not a devkitPro package, so it is fetched from upstream and
      # pinned by hash -- this is a third-party binary entering the build.
      #
      # Deliberately v0.18.3, not the newest. Upstream's Linux builds link
      # against whatever glibc their CI ran: v0.19.0 needs GLIBC_2.38 and
      # v0.18.4 needs 2.34, both newer than the devkitARM image provides
      # ("version `GLIBC_2.38' not found"). v0.18.3 needs only GLIBC_2.14 and
      # produces byte-identical output for this RSF.
      - name: Install makerom
        env:
          MAKEROM_URL: https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.3/makerom-v0.18.3-ubuntu_x86_64.zip
          MAKEROM_SHA256: 6f36f77946742d2b8286a92d887e845e06d430998ed4a9c4856d8ea2d4eebd6f
        run: |
          curl -sSL -o /tmp/makerom.zip "$MAKEROM_URL"
          echo "$MAKEROM_SHA256  /tmp/makerom.zip" | sha256sum -c -
          unzip -o /tmp/makerom.zip -d /usr/local/bin
          chmod +x /usr/local/bin/makerom
          # Fail here, with a clear message, rather than mid-package.
          makerom -? >/dev/null 2>&1 || makerom 2>&1 | head -2

      # Produces emerald3ds.cia (install to a console) and emerald3ds.3ds
      # (CCI -- boots directly in an emulator, no install step).
      - name: Package .cia and .3ds
        run: make -C 3ds

      - name: Upload CIA and 3DS
        uses: actions/upload-artifact@v4
        with:
          name: emerald3ds-${{ matrix.variant }}
          path: |
            3ds/emerald3ds.cia
            3ds/emerald3ds.3ds
            3ds/emerald3ds.smdh
          if-no-files-found: error
