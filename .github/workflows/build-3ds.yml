# Builds the 3DS port from start to end in the official devkitPro container.
# Thus the build is reproducible without a local toolchain.
#
# This is the same sequence as the manual steps in README.md:
#   make tools && make generated
#   tools/generate_wasm_assets.py    makes build/assets
#   rp2350/gen_sound_assets.sh       makes the sample .bin and song .s files
#   3ds/build_objs.sh                makes 3ds/build/libpokeemerald.a
#   make -C 3ds                      makes 3ds/emerald3ds.{cia,3ds}
name: Build 3DS

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels a build that is in progress.
concurrency:
  group: build-3ds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The file 3ds/ACHIEVEMENTS.md lists every achievement. This job fails when
  # the list does not match the tables in 3ds/achievements.c. It is a separate
  # job, so an old list shows as its own red check and does not stop the build.
  achievements-list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check ACHIEVEMENTS.md against achievements.c
        run: python3 3ds/check_achievements_md.py

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: devkitpro/devkitarm:latest

    # One build. The ARM11 runs the original src/m4a_1.s, so this target does
    # not build the C engine (rp2350/m4a_engine.c). The C engine stays in the
    # tree for the RP2350 port, because its Cortex-M33 cannot execute ARM code.
    steps:
      - uses: actions/checkout@v4

      # The decomp tools are host binaries: gbagfx and rsfont need libpng, and
      # the other tools need only g++. The devkitARM image has only the cross
      # toolchain.
      - name: Install host build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkg-config libpng-dev zlib1g-dev python3 \
            curl unzip ca-certificates
          # The checkout gives the tree a different uid from the container user.
          # Without this line, git commands in the build do not run.
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true

      # The script 3ds/build_objs.sh finds arm-none-eabi-gcc on PATH, and stops
      # with an error if it is not there. The file 3ds/Makefile runs smdhtool
      # and 3dsxtool from tools/bin. Set both paths here, and do not rely on the
      # PATH of the image.
      - name: Put devkitARM on PATH
        run: |
          echo "/opt/devkitpro/devkitARM/bin" >> "$GITHUB_PATH"
          echo "/opt/devkitpro/tools/bin" >> "$GITHUB_PATH"

      # The link needs citro2d and citro3d with libctru. The image has them now.
      # This step installs them if a future tag does not have them.
      - name: Ensure 3DS libraries are present
        run: |
          if [ ! -f /opt/devkitpro/libctru/lib/libcitro2d.a ]; then
            dkp-pacman -Sy --noconfirm --needed 3ds-dev
          fi
          arm-none-eabi-gcc --version | head -1

      - name: Build decomp tools
        run: make tools -j"$(nproc)"

      - name: Generate map/JSON sources
        run: make generated

      # The wasm-assets target of the root Makefile runs this through `uv run`.
      # The script uses only the standard library, so this step runs it directly
      # and does not install uv.
      - name: Generate graphics assets
        run: python3 tools/generate_wasm_assets.py

      - name: Generate sound assets
        run: bash rp2350/gen_sound_assets.sh

      - name: Build game archive (ARM11)
        run: bash 3ds/build_objs.sh

      - name: Link emerald3ds.elf
        run: make -C 3ds emerald3ds.elf

      # The ELF is also published alone, because Azahar and Citra can boot a raw
      # ELF, and it gives symbol-level debugging. The .map goes with it. A crash
      # log gives only a raw PC, and these two files are the only way to find
      # its function name.
      - name: Upload ELF + link map
        uses: actions/upload-artifact@v4
        with:
          name: emerald3ds-elf
          path: |
            3ds/emerald3ds.elf
            3ds/build/emerald3ds.map
          if-no-files-found: error

      # The makerom tool is not a devkitPro package. Thus this step gets it from
      # upstream and pins it by hash, because it is a third-party binary in the
      # build.
      #
      # This uses v0.18.3 on purpose, not the newest. Upstream links its Linux
      # builds against the glibc of its own CI. Thus v0.19.0 needs GLIBC_2.38
      # and v0.18.4 needs 2.34. Both are newer than the devkitARM image has
      # ("version `GLIBC_2.38' not found"). The v0.18.3 build needs only
      # GLIBC_2.14 and makes byte-identical output for this RSF.
      - name: Install makerom
        env:
          MAKEROM_URL: https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.3/makerom-v0.18.3-ubuntu_x86_64.zip
          MAKEROM_SHA256: 6f36f77946742d2b8286a92d887e845e06d430998ed4a9c4856d8ea2d4eebd6f
        run: |
          curl -sSL -o /tmp/makerom.zip "$MAKEROM_URL"
          echo "$MAKEROM_SHA256  /tmp/makerom.zip" | sha256sum -c -
          unzip -o /tmp/makerom.zip -d /usr/local/bin
          chmod +x /usr/local/bin/makerom
          # Fail here with a clear message, not during packaging.
          makerom -? >/dev/null 2>&1 || makerom 2>&1 | head -2

      # The bannertool program makes the .bnr from 3ds/meta/. As with makerom,
      # it is not a devkitPro package. Thus this step gets it from upstream and
      # pins it by hash, because it is also a third-party binary in the build.
      #
      # This uses the 2022 mirror from Epicpkmn11 on purpose, because the two
      # usual choices fail. The upstream Steveice10/bannertool is deleted from
      # GitHub, so its releases cannot be pinned. The maintained fork
      # (carstene1ns/3ds-bannertool) publishes Linux builds that need glibc 2.39
      # or newer. That is the same problem as with makerom above ("GLIBC_2.38
      # not found"). A build from source needs cmake 3.28 or newer, which is
      # also newer than this container. This build needs only GLIBC_2.14, the
      # same as makerom v0.18.3, and runs here with no changes.
      #
      # This step always installs it, also before there is banner art. Thus each
      # build tests the pinned URL and hash. If the download runs only when
      # someone adds banner art, it can stop working and nobody knows.
      - name: Install bannertool
        env:
          BANNERTOOL_URL: https://github.com/Epicpkmn11/bannertool/releases/download/v1.2.2/bannertool.zip
          BANNERTOOL_SHA256: e4259c08fe8944ebadd5f4b96f9a8603e5427338074cfc46323fbbc3410d51ed
        run: |
          curl -sSL -o /tmp/bannertool.zip "$BANNERTOOL_URL"
          echo "$BANNERTOOL_SHA256  /tmp/bannertool.zip" | sha256sum -c -
          # Use -j and name the member. This zip has one directory for each
          # platform, but the makerom zip is flat. The makerom command here
          # would put four platform directories into /usr/local/bin, with
          # nothing on PATH.
          unzip -oj /tmp/bannertool.zip 'linux-x86_64/bannertool' -d /usr/local/bin
          chmod +x /usr/local/bin/bannertool
          # Make sure that the tool runs. Do not trust the unzip. A glibc
          # mismatch then fails here with a clear message, not during packaging.
          # This build has no --version flag, and reads it as an invalid
          # command. Thus the check uses the usage text.
          bannertool 2>&1 | head -3
          bannertool 2>&1 | grep -q makebanner || { echo "bannertool failed to run"; exit 1; }

      # Makes emerald3ds.cia (to install on a console) and emerald3ds.3ds (a CCI
      # that boots directly in an emulator, with no install).
      - name: Package .cia and .3ds
        run: make -C 3ds

      - name: Upload CIA and 3DS
        uses: actions/upload-artifact@v4
        with:
          name: emerald3ds
          path: |
            3ds/emerald3ds.cia
            3ds/emerald3ds.3ds
            3ds/emerald3ds.smdh
          if-no-files-found: error
